name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          CODE_CONTEXT_EMBEDDER: hash
        run: pytest --cov=code_context_mcp --cov-report=term-missing

  embedding-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install embedding dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[embedding]"
      - name: Import the default model processor without downloading weights
        run: |
          python - <<'PY'
          from PIL import Image
          from torchvision.transforms.v2 import functional
          from sentence_transformers import SentenceTransformer
          from transformers import EmbeddingGemma2Processor
          PY

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        env:
          CODE_CONTEXT_PROJECTS_ROOT: ${{ runner.temp }}/projects
        run: |
          mkdir -p "$CODE_CONTEXT_PROJECTS_ROOT"
          docker compose -f compose.yml config >/tmp/compose.yml
          grep -q "mem_limit" /tmp/compose.yml
          grep -q "memswap_limit" /tmp/compose.yml
          grep -q "127.0.0.1" /tmp/compose.yml
      - name: Validate MPS v3 compose and scripts
        env:
          CODE_CONTEXT_PROJECTS_ROOT: ${{ runner.temp }}/projects
          CODE_CONTEXT_MPS_TOKEN: ci
          CODE_CONTEXT_MPS_PIPE_DIRECTORY: /run/nvidia-mps/codecontext/mcp
        run: |
          bash -n scripts/start-mps-v3.sh scripts/stop-mps-v3.sh
          docker compose -f compose.yml -f compose.mps.yml config >/tmp/compose-mps.yml
          grep -q "Dockerfile.mps" /tmp/compose-mps.yml
          grep -q "CUDA_MPS_PIPE_DIRECTORY" /tmp/compose-mps.yml
          grep -q "NVIDIA_VISIBLE_DEVICES" /tmp/compose-mps.yml
      - name: Build production image
        run: docker build -t code-context-mcp:ci .
      - name: Run bounded smoke container
        run: |
          docker run -d --name code-context-mcp-ci \
            --memory=512m \
            --memory-swap=512m \
            --cpus=1 \
            --pids-limit=128 \
            --read-only \
            --tmpfs /tmp:rw,size=64m \
            --tmpfs /data:rw,size=64m \
            --tmpfs /cache/huggingface:rw,size=64m \
            -e CODE_CONTEXT_EMBEDDER=hash \
            -e CODE_CONTEXT_DEVICE=cpu \
            -e CODE_CONTEXT_HOME=/data \
            -e CODE_CONTEXT_HOST=0.0.0.0 \
            -p 127.0.0.1:17438:7438 \
            code-context-mcp:ci

          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' code-context-mcp-ci)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs code-context-mcp-ci
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.State.Health.Status}}' code-context-mcp-ci)" = "healthy"
          test "$(docker inspect --format '{{.HostConfig.Memory}}' code-context-mcp-ci)" = "536870912"
      - name: Show logs on failure
        if: failure()
        run: docker logs code-context-mcp-ci || true
      - name: Cleanup
        if: always()
        run: docker rm -f code-context-mcp-ci >/dev/null 2>&1 || true

