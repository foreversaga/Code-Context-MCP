[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "code-context-mcp"
version = "0.1.0"
description = "Local-first, agent-agnostic MCP code intelligence server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "foreversaga" }]
dependencies = [
  "faiss-cpu>=1.15.1,<2",
  "mcp[cli]>=2.2.0,<3",
  "numpy>=1.26,<3",
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-language-pack>=1.20,<2"
]

[project.optional-dependencies]
embedding = [
  "sentence-transformers[image]>=6.1.0,<7"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1"
]

[project.scripts]
code-context-mcp = "code_context_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_context_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
